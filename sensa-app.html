<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Sensa Panetteria</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sensa">
  <meta name="theme-color" content="#34522A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    :root { --cream:#F5F6EF; --pistachio:#DAE38E; --forest:#34522A; --olive:#818A6D; --cotton:#FFD2D8; --rose:#DC9FAB; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#F2F3EC;font-family:'Instrument Sans',-apple-system,sans-serif;color:#1A1A1A;}
    h1,h2,h3,.serif{font-family:'Instrument Serif',Georgia,serif;}
    /* ── Sidebar ── */
    .sidebar{background:var(--forest);width:228px;flex-shrink:0;height:100vh;display:flex;flex-direction:column;padding:24px 14px;}
    .sidebar-logo{font-family:'Instrument Serif',serif;font-size:36px;font-style:italic;color:var(--pistachio);line-height:1;letter-spacing:-.5px;}
    .sidebar-sub{font-size:8.5px;letter-spacing:4px;text-transform:uppercase;color:rgba(218,227,142,.45);margin-top:3px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:rgba(245,246,239,.6);font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s;margin:1px 0;}
    .nav-item:hover{background:rgba(255,255,255,.08);color:var(--cream);}
    .nav-item.active{background:rgba(218,227,142,.25);color:var(--pistachio);font-weight:700;}
    /* ── Cards ── */
    .card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);}
    .card-hover{transition:transform .15s,box-shadow .15s;cursor:pointer;}
    .card-hover:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1);}
    .card-hover:active{transform:translateY(0);box-shadow:0 2px 8px rgba(0,0,0,.08);}
    /* ── Forms ── */
    input,select,textarea{border:1.5px solid #E0E8D4;border-radius:10px;padding:10px 13px;width:100%;outline:none;font-size:14px;font-family:'Instrument Sans',sans-serif;background:#fff;color:#1A1A1A;transition:border-color .15s,box-shadow .15s;}
    input:focus,select:focus,textarea:focus{border-color:var(--forest);box-shadow:0 0 0 3px rgba(52,82,42,.1);}
    label{font-size:11px;font-weight:700;color:var(--olive);display:block;margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase;}
    /* ── Buttons ── */
    .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;font-weight:600;font-size:13.5px;font-family:'Instrument Sans',sans-serif;cursor:pointer;transition:all .12s;border:none;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
    .btn-p{background:var(--forest);color:#fff;padding:10px 20px;}
    .btn-p:hover{background:#2d4724;}
    .btn-p:active{background:#243d1c;transform:scale(.98);}
    .btn-s{background:#fff;color:var(--forest);border:1.5px solid #C8D8B8;padding:9px 16px;}
    .btn-s:hover{background:var(--cream);}
    .btn-s:active{background:#E8EDDE;transform:scale(.98);}
    .btn-g{background:transparent;color:var(--olive);padding:7px 10px;border-radius:9px;}
    .btn-g:hover{background:#F0F2EA;color:var(--forest);}
    .btn-g:active{background:#E4E8DA;transform:scale(.95);}
    .btn-d{background:#FFF1F2;color:#BE123C;border:1.5px solid #FECDD3;padding:9px 16px;}
    .btn-d:hover{background:#FFE4E6;}
    .btn-d:active{transform:scale(.98);}
    .btn-sm{padding:6px 10px!important;font-size:12px!important;border-radius:8px!important;min-width:34px;justify-content:center;}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    /* ── Badges ── */
    .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
    .bg{background:var(--pistachio);color:var(--forest);}
    .bp{background:var(--cotton);color:#9D174D;}
    .br{background:var(--rose);color:#7D1D3F;}
    .bc{background:var(--cream);color:var(--olive);border:1px solid #DDE8CC;}
    .bl{background:#DBEAFE;color:#1E3A5F;}
    .brd{background:#FFE4E6;color:#BE123C;}
    .by{background:#FEF9C3;color:#92400E;}
    /* ── Tables ── */
    table{width:100%;border-collapse:collapse;}
    th{text-align:left;padding:10px 16px;font-size:10.5px;font-weight:700;color:var(--olive);text-transform:uppercase;letter-spacing:.07em;border-bottom:1.5px solid #EEF0E8;font-family:'Instrument Sans',sans-serif;}
    td{padding:12px 16px;font-size:13.5px;border-bottom:1px solid #F4F5EE;color:#1A1A1A;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:#F7F9F3;}
    @media(hover:none){tr:hover td{background:inherit;}tr:active td{background:#F7F9F3;}}
    /* ── Modals ── */
    .modal-bg{background:rgba(0,0,0,.45);backdrop-filter:blur(4px);position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal-box{background:#fff;border-radius:18px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.22);}
    .modal-handle{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.15);margin:10px auto 0;flex-shrink:0;}
    .modal-head{background:var(--forest);border-radius:17px 17px 0 0;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;}
    .field{margin-bottom:16px;}
    /* ── Layout responsivo ── */
    .sb-desktop{display:flex;flex-shrink:0;}
    .mob-bar{display:none;}
    .pp{padding:28px 24px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tbl table{min-width:480px;}
    @media(max-width:960px){
      .sb-desktop{display:none!important;}
      .mob-bar{display:flex!important;}
      .bottom-nav{display:flex!important;}
      .modal-bg{align-items:flex-end;padding:0;}
      .modal-box{border-radius:18px 18px 0 0;max-height:92vh;margin:0;}
      .modal-box::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.12);margin:10px auto 0;flex-shrink:0;}
      /* Prevent Safari iOS from zooming on input focus */
      input,select,textarea{font-size:16px!important;}
      label{font-size:11px!important;}
    }
    @media(max-width:680px){
      .pp{padding:16px 14px!important;}
      .g2{grid-template-columns:1fr!important;}
      .g3{grid-template-columns:1fr 1fr!important;}
      .modal-g2{grid-template-columns:1fr!important;}
    }
    @media(max-width:420px){
      .g3{grid-template-columns:1fr!important;}
    }
    @media(max-width:680px){
      .cal-cell{min-height:56px!important;}
      .rep-dates{flex-direction:column!important;}
      .rep-dates>div{width:100%!important;}
      .rep-dates input{width:100%!important;}
    }
    @keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    .toast{animation:toastIn .2s ease;}
    /* ── Hamburger button ── */
    .ham-btn{display:flex;flex-direction:column;justify-content:center;gap:5px;width:38px;height:38px;background:rgba(255,255,255,.1);border:none;border-radius:10px;cursor:pointer;padding:9px 8px;flex-shrink:0;transition:background .15s;}
    .ham-btn:hover,.ham-btn:active{background:rgba(255,255,255,.2);}
    .ham-btn span{display:block;width:100%;height:2px;background:var(--pistachio);border-radius:2px;transition:all .2s;}
    /* ── Bottom nav ── */
    .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.06);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);}
    .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 7px;gap:4px;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:54px;position:relative;transition:opacity .1s;}
    .bnav-dot{position:absolute;top:6px;width:4px;height:4px;border-radius:50%;background:var(--forest);opacity:0;transition:opacity .2s;}
    .bnav-icon{display:flex;align-items:center;justify-content:center;height:26px;transition:transform .15s,color .15s;color:var(--olive);}
    .bnav-label{font-size:10px;font-weight:500;color:var(--olive);letter-spacing:.01em;font-family:'Instrument Sans',sans-serif;transition:color .2s,font-weight .2s;}
    .bnav-item.active .bnav-dot{opacity:1;}
    .bnav-item.active .bnav-icon{color:var(--forest);transform:scale(1.05);}
    .bnav-item.active .bnav-label{color:var(--forest);font-weight:700;}
    .bnav-item:active{opacity:.6;}
    /* ── Back button mobile ── */
    .back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1.5px solid #C8D8B8;background:#fff;color:var(--forest);font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Instrument Sans',sans-serif;margin-bottom:16px;-webkit-tap-highlight-color:transparent;}
    .back-btn:active{background:var(--cream);}
    @media print{body>*{display:none!important;}#pa{display:block!important;}}
    #pa{display:none;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-thumb{background:#C8D8B8;border-radius:3px;}
  </style>
</head>
<body>

<!-- Loading state shown until React mounts -->
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;background:var(--cream)">
    <div style="font-family:'Instrument Serif',serif;font-style:italic;font-size:40px;color:var(--forest)">sensa</div>
    <div style="font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--olive)">Cargando…</div>
  </div>
</div>
<div id="pa"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ── CONSTANTS ──────────────────────────────────────────────────────────────
const LSK = 'sensa_v3', LSF = 'sensa_fb';
const MONEDAS = [{value:'CRC',label:'Colones (₡)',sym:'₡'},{value:'USD',label:'Dólares ($)',sym:'$'}];
const UNIDADES = ['kg','g','lt','ml','pz','taza','cucharada','cucharadita','sobre','lata','bolsa'];
const ESTADOS = ['Cotización','Confirmado','En proceso','Listo','Entregado','Cancelado'];
const BADGE_E = {'Cotización':'bc','Confirmado':'bl','En proceso':'bp','Listo':'bg','Entregado':'bg','Cancelado':'brd'};
const NAV = [
  {id:'home',label:'Inicio',icon:'home'},
  {id:'ing',label:'Ingredientes',icon:'layers'},
  {id:'rec',label:'Recetas',icon:'book'},
  {id:'calc',label:'Calculadora',icon:'calc'},
  {id:'cli',label:'Clientes',icon:'users'},
  {id:'ped',label:'Pedidos',icon:'package'},
  {id:'cal',label:'Calendario',icon:'calendar'},
  {id:'rep',label:'Reportes',icon:'chart'},
  {id:'cfg',label:'Configuración',icon:'settings'},
];
const DEF = {ing:[],rec:[],prod:[],cli:[],ped:[],cfg:{nombre:'Sensa Panetteria',moneda:'CRC',sym:'₡',dir:'',tel:'',gastos_fijos:0,horas_mes:60}};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── UTILS ──────────────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){return new Date().toISOString().split('T')[0];}
function fmt(n,sym='₡'){
  const v=+n||0;
  return sym==='₡'?'₡'+Math.round(v).toLocaleString('es-CR'):'$'+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function fdate(s){if(!s)return'—';return new Date(s+'T12:00').toLocaleDateString('es-CR',{day:'numeric',month:'short',year:'numeric'});}
function loadLS(){try{const s=localStorage.getItem(LSK);if(!s)return DEF;const p=JSON.parse(s);return{...DEF,...p,cfg:{...DEF.cfg,...(p.cfg||{})}};}catch{return DEF;}}
function saveLS(d){localStorage.setItem(LSK,JSON.stringify(d));}
function loadFB(){try{const s=localStorage.getItem(LSF);return s?JSON.parse(s):null;}catch{return null;}}
function recipeCost(r,ings){return(r.ing||[]).reduce((t,ri)=>{const i=ings.find(x=>x.id===ri.id);return i?t+(i.price/(i.qty||1))*(ri.qty||0):t;},0);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}


// ── ICONS ──────────────────────────────────────────────────────────────────
const ICONS={
  home:'M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8~~M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  layers:'M12 2 2 7l10 5 10-5-10-5z~~M2 17l10 5 10-5~~M2 12l10 5 10-5',
  book:'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z~~M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z',
  calc:'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z~~M8 7h8~~M8 11h8~~M8 15h4',
  users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2~~M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8z~~M22 21v-2a4 4 0 0 0-3-3.87~~M16 3.13a4 4 0 0 1 0 7.75',
  package:'M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z~~M3.27 6.96L12 12.01l8.73-5.05~~M12 22.08V12',
  calendar:'M8 2v4~~M16 2v4~~M3 10h18~~M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z',
  chart:'M18 20V10~~M12 20V4~~M6 20v-6',
  settings:'M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z~~M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  edit:'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7~~M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z',
  trash:'M3 6h18~~M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6~~M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
  eye:'M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z~~M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  print:'M6 9V2h12v7~~M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2~~M6 14h12v8H6z',

  search:'M10 3a7 7 0 1 0 0 14A7 7 0 0 0 10 3z~~M21 21l-4.35-4.35',
  plus:'M12 5v14~~M5 12h14',
  check:'M20 6L9 17l-5-5',
  x:'M18 6L6 18~~M6 6l12 12',
  alert:'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z~~M12 9v4~~M12 17h.01',
  cloud:'M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z',
  menu:'M3 12h18~~M3 6h18~~M3 18h18',
  left:'M19 12H5~~M12 19l-7-7 7-7',
  bread:'M17.5 5A5.5 5.5 0 0 1 17.5 16H7a5 5 0 0 1 0-10h.21A5.5 5.5 0 0 1 17.5 5z~~M2.5 11.5a2.5 2.5 0 0 0 0 5H7',
};
function Icon({n,s=18,c='currentColor',sw=1.75}){
  const d=ICONS[n];if(!d)return null;
  return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{display:'block',flexShrink:0}}>
    {d.split('~~').map((p,i)=><path key={i} d={p}/>)}
  </svg>;
}
// ── TOAST ──────────────────────────────────────────────────────────────────
let _toast=null;
function toast(msg,type='ok'){if(_toast)_toast({id:uid(),msg,type});}
function Toaster(){
  const[items,setItems]=useState([]);
  useEffect(()=>{
    _toast=t=>{setItems(p=>[...p,t]);setTimeout(()=>setItems(p=>p.filter(x=>x.id!==t.id)),3000);};
    return()=>{_toast=null;};
  },[]);
  if(!items.length)return null;
  return(
    <div style={{position:'fixed',top:20,left:'50%',transform:'translateX(-50%)',zIndex:200,display:'flex',flexDirection:'column',gap:8,pointerEvents:'none',alignItems:'center'}}>
      {items.map(t=>(
        <div key={t.id} className="toast" style={{padding:'11px 16px',borderRadius:10,fontWeight:600,fontSize:13.5,background:t.type==='err'?'#BE123C':'var(--forest)',color:'#fff',boxShadow:'0 4px 20px rgba(0,0,0,.25)',display:'flex',alignItems:'center',gap:8}}>
          {t.type==='err'?<Icon n='alert' s={15} c='#fff'/>:<Icon n='check' s={15} c='#fff'/>}{t.msg}
        </div>
      ))}
    </div>
  );
}

// ── ERROR BOUNDARY ─────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component{
  state={err:null};
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,info){console.error('[Sensa]',e,info);}
  render(){
    if(this.state.err)return(
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--cream)',gap:16,padding:24,textAlign:'center'}}>
        <div style={{width:60,height:60,borderRadius:"50%",background:"#F0F7E8",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon n="bread" s={26} c="var(--forest)"/></div>
        <h2 style={{fontFamily:'Instrument Serif,serif',color:'var(--forest)',fontSize:24}}>Algo salió mal</h2>
        <p style={{color:'var(--olive)',fontSize:13.5,maxWidth:320}}>{this.state.err.message}</p>
        <button className="btn btn-p" onClick={()=>this.setState({err:null})}>Reintentar</button>
      </div>
    );
    return this.props.children;
  }
}

// ── FIREBASE ───────────────────────────────────────────────────────────────
let _db=null,_ws=null;
function col(c){return _db.collection('ws').doc(_ws).collection(c);}
function fbUpsert(c,doc){const{id,...d}=doc;return col(c).doc(id).set(d);}
function fbDel(c,id){return col(c).doc(id).delete();}
function fbCfg(d){return col('config').doc('main').set(d);}
function initFB(config,ws){
  try{
    if(firebase.apps.length)firebase.apps.forEach(a=>a.delete());
    firebase.initializeApp(config);
    _db=firebase.firestore();
    _ws=ws;
    _db.enablePersistence().catch(()=>{});
    return true;
  }catch(e){console.error(e);return false;}
}

// ── SMALL UI ───────────────────────────────────────────────────────────────
function Btn({onClick,children,v='p',sm,disabled,cls=''}){
  return <button onClick={onClick} disabled={disabled} className={`btn btn-${v}${sm?' btn-sm':''} ${cls}`}>{children}</button>;
}
function Modal({title,onClose,children,wide}){
  useEffect(()=>{const h=e=>e.key==='Escape'&&onClose();window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[onClose]);
  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box" style={{maxWidth:wide?740:580}}>
        <div className="modal-head">
          <h2 style={{fontFamily:'Instrument Serif,serif',fontSize:19,fontStyle:'italic',color:'var(--pistachio)',fontWeight:400}}>{title}</h2>
          <button onClick={onClose} style={{width:28,height:28,borderRadius:'50%',border:'none',background:'rgba(255,255,255,.12)',cursor:'pointer',fontSize:13,color:'rgba(218,227,142,.7)',display:'flex',alignItems:'center',justifyContent:'center',transition:'background .15s'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.22)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,.12)'}>✕</button>
        </div>
        <div style={{padding:'22px 24px'}}>{children}</div>
      </div>
    </div>
  );
}
function F({label,children}){return <div className="field"><label>{label}</label>{children}</div>;}
function FI({label,...p}){return <F label={label}><input {...p}/></F>;}
function FS({label,opts,...p}){return <F label={label}><select {...p}>{opts.map(o=><option key={o.v??o} value={o.v??o}>{o.l??o}</option>)}</select></F>;}
function FT({label,...p}){return <F label={label}><textarea rows={3} style={{resize:'none'}} {...p}/></F>;}
function CDel({what,onOk,onNo}){
  return <Modal title="Eliminar" onClose={onNo}><p style={{color:'#555',marginBottom:20}}>¿Eliminar <strong>{what}</strong>? No se puede deshacer.</p><div style={{display:'flex',gap:12,justifyContent:'flex-end'}}><Btn v='s' onClick={onNo}>Cancelar</Btn><Btn v='d' onClick={onOk}><Icon n='trash' s={14}/> Eliminar</Btn></div></Modal>;
}
function CConfirm({title,body,okLabel='Confirmar',danger,onOk,onNo}){
  return <Modal title={title} onClose={onNo}><p style={{color:'#555',marginBottom:20}}>{body}</p><div style={{display:'flex',gap:12,justifyContent:'flex-end'}}><Btn v='s' onClick={onNo}>Cancelar</Btn><Btn v={danger?'d':'p'} onClick={onOk}>{okLabel}</Btn></div></Modal>;
}
function Empty({icon,title,sub,action}){
  return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'80px 20px',textAlign:'center'}}>
    <div style={{width:64,height:64,borderRadius:'50%',background:'#EAF0E4',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16}}>{icon}</div>
    <h3 className="serif" style={{fontSize:20,color:'var(--forest)',marginBottom:6}}>{title}</h3>
    <p style={{fontSize:13.5,color:'var(--olive)',maxWidth:280,marginBottom:24}}>{sub}</p>
    {action}
  </div>;
}
function PH({title,sub,action}){
  return <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:28}}>
    <div>
      <h1 style={{fontFamily:'Instrument Serif,serif',fontSize:30,fontStyle:'italic',color:'var(--forest)',fontWeight:400,lineHeight:1.1}}>{title}</h1>
      {sub&&<p style={{fontSize:13,color:'var(--olive)',marginTop:5}}>{sub}</p>}
    </div>
    {action&&<div style={{flexShrink:0,marginLeft:16,marginTop:4}}>{action}</div>}
  </div>;
}
function SB({val,set,ph}){
  return <div className="card" style={{display:'flex',alignItems:'center',gap:8,padding:'10px 16px',marginBottom:16}}>
    <Icon n='search' s={16} c='#bbb'/>
    <input value={val} onChange={e=>set(e.target.value)} placeholder={ph||'Buscar...'} style={{border:'none',boxShadow:'none',padding:0,background:'transparent',fontSize:14,flex:1}}/>
  </div>;
}

// ── SETUP WIZARD ───────────────────────────────────────────────────────────
function Setup({onDone,onSkip}){
  const [step,setStep]=useState(0);
  const [raw,setRaw]=useState('');
  const [cfg,setCfg]=useState(null);
  const [wsId,setWsId]=useState('sensa');
  const [err,setErr]=useState('');

  function parse(){
    try{
      const m=raw.match(/\{[\s\S]*\}/);
      if(!m)throw new Error();
      const c=m[0].replace(/([a-zA-Z_]\w*)(\s*:)/g,'"$1"$2').replace(/'/g,'"').replace(/,(\s*[}\]])/g,'$1');
      const p=JSON.parse(c);
      if(!p.apiKey||!p.projectId)throw new Error();
      setCfg(p);setErr('');setStep(3);
    }catch{setErr('No se pudo leer. Copiá el bloque completo que incluye las llaves { }.');}
  }

  function connect(){
    if(!cfg)return;
    const ok=initFB(cfg,wsId);
    if(ok){localStorage.setItem(LSF,JSON.stringify({config:cfg,workspaceId:wsId}));onDone();}
    else setErr('No se pudo conectar. Revisá el config.');
  }

  const steps=[
    {title:'Crear proyecto Firebase',body:<>
      <div className="card" style={{background:'var(--cream)',padding:16,marginBottom:16}}>
        <p style={{fontSize:13,fontWeight:600,color:'var(--forest)',marginBottom:12}}>Seguí estos pasos (5 min):</p>
        <ol style={{listStyle:'none',display:'flex',flexDirection:'column',gap:10}}>
          {[<>Entrá a <a href="https://console.firebase.google.com" target="_blank" style={{color:'var(--forest)',textDecoration:'underline'}}>console.firebase.google.com</a></>,
            <>Clic en <strong>"Agregar proyecto"</strong></>,
            <>Nombre: <strong>sensa-panetteria</strong> → Continuar</>,
            <>Desactivá Google Analytics → <strong>Crear proyecto</strong></>,
            <>Clic en el ícono <strong>Web ( &lt;/&gt; )</strong></>,
            <>Nombre: <strong>sensa-app</strong> → Registrar</>,
          ].map((s,i)=><li key={i} style={{display:'flex',gap:10,fontSize:13}}>
            <span style={{width:22,height:22,borderRadius:'50%',background:'var(--forest)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</span>
            <span>{s}</span>
          </li>)}
        </ol>
      </div>
      <Btn onClick={()=>setStep(1)}>Tengo el proyecto →</Btn>
    </>},
    {title:'Activar base de datos',body:<>
      <div className="card" style={{background:'var(--cream)',padding:16,marginBottom:16}}>
        <ol style={{listStyle:'none',display:'flex',flexDirection:'column',gap:10}}>
          {[<>En el menú izquierdo → <strong>Firestore Database</strong></>,
            <>Clic en <strong>"Crear base de datos"</strong></>,
            <>Elegí <strong>"Modo de prueba"</strong> → Siguiente</>,
            <>Ubicación <strong>us-central1</strong> → Listo</>,
          ].map((s,i)=><li key={i} style={{display:'flex',gap:10,fontSize:13}}>
            <span style={{width:22,height:22,borderRadius:'50%',background:'var(--forest)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</span>
            <span>{s}</span>
          </li>)}
        </ol>
      </div>
      <div style={{display:'flex',gap:12}}><Btn v='s' onClick={()=>setStep(0)}>← Atrás</Btn><Btn onClick={()=>setStep(2)}>Listo →</Btn></div>
    </>},
    {title:'Copiar el código de configuración',body:<>
      <div className="card" style={{background:'var(--cream)',padding:16,marginBottom:16}}>
        <ol style={{listStyle:'none',display:'flex',flexDirection:'column',gap:10}}>
          {[<>Clic en ⚙️ → <strong>Configuración del proyecto</strong></>,
            <>Bajá a <strong>"Tus apps"</strong> → SDK → <strong>Configuración</strong></>,
            <>Copiá el bloque <code style={{background:'rgba(0,0,0,.06)',padding:'1px 6px',borderRadius:4}}>const firebaseConfig = {'{ … }'}</code></>,
          ].map((s,i)=><li key={i} style={{display:'flex',gap:10,fontSize:13}}>
            <span style={{width:22,height:22,borderRadius:'50%',background:'var(--forest)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</span>
            <span>{s}</span>
          </li>)}
        </ol>
      </div>
      <F label="Pegá el bloque aquí">
        <textarea value={raw} onChange={e=>setRaw(e.target.value)} rows={6} placeholder={'const firebaseConfig = {\n  apiKey: "...",\n  projectId: "...",\n  ...\n};'} style={{fontFamily:'monospace',fontSize:12,resize:'none'}}/>
      </F>
      {err&&<p style={{color:'#BE123C',fontSize:13,marginBottom:12}}>{err}</p>}
      <div style={{display:'flex',gap:12}}><Btn v='s' onClick={()=>setStep(1)}>← Atrás</Btn><Btn onClick={parse} disabled={!raw.trim()}>Continuar →</Btn></div>
    </>},
    {title:'Nombre de tu espacio',body:<>
      <p style={{fontSize:13,color:'var(--olive)',marginBottom:16}}>Usá el mismo nombre en todos tus dispositivos para que se sincronicen.</p>
      <FI label="ID del espacio de trabajo" value={wsId} onChange={e=>setWsId(e.target.value.toLowerCase().replace(/\s+/g,'-'))} placeholder="sensa"/>
      <div className="card" style={{background:'#F0F7E8',padding:12,marginBottom:16}}>
        <p style={{fontSize:12,color:'var(--forest)'}}>Cualquier dispositivo con el mismo Firebase config + este ID verá los mismos datos.</p>
      </div>
      {err&&<p style={{color:'#BE123C',fontSize:13,marginBottom:12}}>{err}</p>}
      <div style={{display:'flex',gap:12}}><Btn v='s' onClick={()=>setStep(2)}>← Atrás</Btn><Btn onClick={connect} disabled={!wsId}>Conectar y sincronizar</Btn></div>
    </>},
  ];

  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'var(--cream)'}}>
      <div style={{width:'100%',maxWidth:480}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <div className="serif" style={{fontSize:44,fontStyle:'italic',color:'var(--forest)'}}>sensa</div>
          <div style={{fontSize:10,letterSpacing:4,textTransform:'uppercase',color:'var(--olive)'}}>Panetteria</div>
        </div>
        <div className="card" style={{padding:24}}>
          <div style={{display:'flex',gap:4,marginBottom:24}}>
            {steps.map((_,i)=><div key={i} style={{height:4,flex:1,borderRadius:2,background:i<=step?'var(--forest)':'#E2E8D8',transition:'background .3s'}}/>)}
          </div>
          <h2 className="serif" style={{fontSize:20,color:'var(--forest)',marginBottom:16}}>{steps[step].title}</h2>
          {steps[step].body}
          <button onClick={onSkip} style={{marginTop:16,fontSize:12,color:'var(--olive)',background:'none',border:'none',cursor:'pointer',textDecoration:'underline',display:'block',width:'100%',textAlign:'center'}}>
            Usar sin sincronización (solo este dispositivo)
          </button>
        </div>
      </div>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────
function Home({D,go}){
  const {sym}=D.cfg;
  const hoy=today(),mes=hoy.slice(0,7);
  const activos=D.ped.filter(p=>!['Entregado','Cancelado'].includes(p.estado));
  const ing=D.ped.filter(p=>p.estado==='Entregado'&&(p.fecha||'').startsWith(mes)).reduce((s,p)=>s+(p.total||0),0);
  const cobros=D.ped.filter(p=>['Listo','Entregado'].includes(p.estado)&&(p.total||0)-(p.adelanto||0)>0.01);
  const prox=D.ped.filter(p=>p.fecha_e>=hoy&&p.estado!=='Cancelado').sort((a,b)=>a.fecha_e.localeCompare(b.fecha_e)).slice(0,5);
  const cl=id=>D.cli.find(c=>c.id===id);
  const h=new Date().getHours();
  return(
    <div className="pp" style={{maxWidth:900,margin:'0 auto'}}>
      <div style={{marginBottom:28}}>
        <div style={{display:'flex',alignItems:'baseline',gap:10}}>
          <h1 style={{fontFamily:'Instrument Serif,serif',fontSize:32,fontStyle:'italic',color:'var(--forest)',fontWeight:400}}>
            {h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'}
          </h1>
        </div>
        <p style={{fontSize:13,color:'var(--olive)',marginTop:4}}>{new Date().toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'})}</p>
      </div>
      <div className="g2" style={{gap:12,marginBottom:28}}>
        {[
          {l:'Pedidos activos',v:activos.length,i:'package',bg:'linear-gradient(135deg,#F0F7E8,#E8F0DC)',c:'var(--forest)',p:'ped'},
          {l:'Ingresos del mes',v:fmt(ing,sym),i:'chart',bg:'linear-gradient(135deg,#FAFBF4,#F2F4E8)',c:'var(--forest)',p:'rep'},
          {l:'Próximas entregas',v:prox.length,i:'calendar',bg:'linear-gradient(135deg,var(--cotton),#FFC8D0)',c:'#9D174D',p:'cal'},
          {l:'Cobros pendientes',v:cobros.length,i:'alert',bg:'linear-gradient(135deg,#FFF1F2,#FFE4E6)',c:'#BE123C',p:'ped'},
        ].map(s=>(
          <div key={s.l} onClick={()=>go(s.p)} className="card card-hover" style={{padding:20,background:s.bg}}>
            <div style={{marginBottom:10}}><Icon n={s.i} s={22} c={s.c} sw={1.5}/></div>
            <div style={{fontFamily:'Instrument Serif,serif',fontSize:30,color:s.c,lineHeight:1}}>{s.v}</div>
            <div style={{fontSize:10.5,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:s.c,opacity:.65,marginTop:6}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div className="g2" style={{gap:16,alignItems:'start'}}>
        <div className="card" style={{padding:20}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <h2 style={{fontFamily:'Instrument Serif,serif',fontSize:18,fontStyle:'italic',color:'var(--forest)',fontWeight:400}}>Próximas entregas</h2>
            <button onClick={()=>go('ped')} style={{fontSize:12,color:'var(--olive)',background:'none',border:'none',cursor:'pointer'}}>Ver todos →</button>
          </div>
          {prox.length===0?<p style={{fontSize:13,color:'var(--olive)',textAlign:'center',padding:'20px 0'}}>Sin entregas próximas ✓</p>:
            prox.map(p=>(
              <div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'10px 0',borderBottom:'1px solid #F5F5EE'}}>
                <div><div style={{fontSize:13.5,fontWeight:600}}>{cl(p.cli_id)?.nombre||'Sin cliente'}</div><div style={{fontSize:12,color:'var(--olive)',marginTop:2}}>{fdate(p.fecha_e)}</div></div>
                <div style={{textAlign:'right'}}><div style={{fontSize:13.5,fontWeight:700}}>{fmt(p.total||0,sym)}</div><span className={`badge ${BADGE_E[p.estado]||'bc'}`}>{p.estado}</span></div>
              </div>
            ))
          }
        </div>
        <div className="card" style={{padding:20}}>
          <h2 style={{fontFamily:'Instrument Serif,serif',fontSize:18,fontStyle:'italic',color:'var(--forest)',fontWeight:400,marginBottom:16}}>Cobros pendientes</h2>
          {cobros.length===0?<p style={{fontSize:13,color:'var(--olive)',textAlign:'center',padding:'20px 0'}}>Todo cobrado ✓</p>:
            cobros.slice(0,5).map(p=>(
              <div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'10px 0',borderBottom:'1px solid #F5F5EE'}}>
                <div><div style={{fontSize:13.5,fontWeight:600}}>{cl(p.cli_id)?.nombre||'Sin cliente'}</div><div style={{fontSize:12,color:'var(--olive)',marginTop:2}}>{fdate(p.fecha_e)}</div></div>
                <div style={{fontSize:13.5,fontWeight:700,color:'#BE123C'}}>{fmt((p.total||0)-(p.adelanto||0),sym)}</div>
              </div>
            ))
          }
        </div>
      </div>
    </div>
  );
}

// ── INGREDIENTES ──────────────────────────────────────────────────────────
function Ing({D,ops}){
  const [q,setQ]=useState('');
  const [modal,setModal]=useState(null);
  const [del,setDel]=useState(null);
  const {sym}=D.cfg;
  const list=useMemo(()=>D.ing.filter(i=>`${i.nombre} ${i.prov||''}`.toLowerCase().includes(q.toLowerCase())),[D.ing,q]);
  const save=d=>{ops.ups('ing',d,modal?.id);setModal(null);toast(modal?.id?'Ingrediente actualizado':'Ingrediente agregado');};
  return(
    <div className="pp" style={{maxWidth:960,margin:'0 auto'}}>
      <PH title="Ingredientes" sub={`${D.ing.length} registrados`} action={<Btn onClick={()=>setModal({})}>+ Agregar</Btn>}/>
      <SB val={q} set={setQ} ph="Buscar ingrediente o proveedor..."/>
      {list.length===0?<Empty icon={<Icon n="layers" s={26} c="var(--forest)"/>} title="Sin ingredientes" sub="Agregá tus harinas, levaduras, sal y más." action={<Btn onClick={()=>setModal({})}>+ Agregar</Btn>}/>:
        <div className="card tbl" style={{overflow:'hidden'}}>
          <table>
            <thead><tr><th>Ingrediente</th><th>Precio</th><th>Presentación</th><th>Costo/unidad</th><th>Proveedor</th><th></th></tr></thead>
            <tbody>{list.map(i=>(
              <tr key={i.id}>
                <td style={{fontWeight:600}}>{i.nombre}</td>
                <td>{fmt(i.price,sym)}</td>
                <td style={{color:'var(--olive)',fontSize:13}}>{i.qty} {i.unit}</td>
                <td style={{fontFamily:'monospace',fontSize:12}}>{fmt(i.price/(i.qty||1),sym)}/{i.unit}</td>
                <td style={{color:'var(--olive)',fontSize:13}}>{i.prov||'—'}</td>
                <td><div style={{display:'flex',gap:4}}><Btn v='g' sm onClick={()=>setModal(i)}><Icon n='edit' s={14}/></Btn><Btn v='g' sm onClick={()=>setDel(i)}><Icon n='trash' s={14}/></Btn></div></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      }
      {modal!==null&&<IngModal ing={modal} onSave={save} onClose={()=>setModal(null)} sym={sym}/>}
      {del&&<CDel what={del.nombre} onOk={()=>{ops.del('ing',del.id);setDel(null);toast('Ingrediente eliminado','err');}} onNo={()=>setDel(null)}/>}
    </div>
  );
}
function IngModal({ing,onSave,onClose,sym}){
  const[f,sf]=useState({nombre:'',price:'',qty:'1',unit:'kg',prov:'',notes:'',...ing});
  const s=k=>e=>sf(p=>({...p,[k]:e.target.value}));
  const cu=f.price&&f.qty?(+f.price/+f.qty):0;
  return(
    <Modal title={ing.id?'Editar ingrediente':'Nuevo ingrediente'} onClose={onClose}>
      <FI label="Nombre *" value={f.nombre} onChange={s('nombre')} placeholder="Ej: Harina de trigo"/>
      <div className="modal-g2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <FI label="Precio de compra" type="number" step="1" value={f.price} onChange={s('price')} placeholder="0"/>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <FI label="Cantidad" type="number" step=".001" value={f.qty} onChange={s('qty')} placeholder="1"/>
          <FS label="Unidad" value={f.unit} onChange={s('unit')} opts={UNIDADES}/>
        </div>
      </div>
      {cu>0&&<div style={{background:'#F0F7E8',borderRadius:9,padding:'8px 12px',marginBottom:16,fontSize:12.5,fontWeight:600,color:'var(--forest)'}}>Costo por {f.unit}: <strong>{fmt(cu,sym)}</strong></div>}
      <FI label="Proveedor" value={f.prov||''} onChange={s('prov')} placeholder="Nombre del proveedor"/>
      <FT label="Notas" value={f.notes||''} onChange={s('notes')} placeholder="Observaciones..."/>
      <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:8}}>
        <Btn v='s' onClick={onClose}>Cancelar</Btn>
        <Btn onClick={()=>f.nombre.trim()&&onSave(f)} disabled={!f.nombre.trim()}>Guardar</Btn>
      </div>
    </Modal>
  );
}

// ── RECETAS ───────────────────────────────────────────────────────────────
function Rec({D,ops}){

  return(

            return(
              <div key={r.id} className="card" style={{padding:20}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>

                  <div style={{display:'flex',gap:4}}>
                    <Btn v='g' sm onClick={()=>setBas(r)} title='Báscula'><Icon n='scale' s={14}/></Btn>
                    <Btn v='g' sm onClick={()=>setModal(r)}><Icon n='edit' s={14}/></Btn>
                    <Btn v='g' sm onClick={()=>setDel(r)}><Icon n='trash' s={14}/></Btn>
                  </div>

                  <span style={{fontSize:12,color:'var(--olive)'}}>Costo</span>

              </div>
            );
          })}

      }

  );
}

}
function BascModal({rec,ings,sym,onClose}){
  const[modo,setModo]=useState('tandas');
  const[cant,setCant]=useState(1);
  const factor=modo==='tandas'?cant:cant/(rec.rend||1);
  const items=(rec.ing||[]).map(ri=>{
    const i=ings.find(x=>x.id===ri.id);
    const q=ri.qty*factor;
    return{nombre:i?.nombre||'?',unit:i?.unit||'',q,costo:i?(i.price/(i.qty||1))*ri.qty*factor:0};
  });
  const total=items.reduce((s,i)=>s+i.costo,0);
  function print(){
    const html=`<div style="font-family:sans-serif;max-width:420px;margin:0 auto;padding:24px"><h2 style="color:#34522A">Lista de compra — ${esc(rec.nombre)}</h2><p style="color:#818A6D">${cant} ${modo==='tandas'?'tanda(s)':(rec.rend_u||'unidades')}</p><table style="width:100%;border-collapse:collapse;margin-top:12px"><tr style="border-bottom:2px solid #eee"><th style="text-align:left;padding:6px 0">Ingrediente</th><th style="text-align:right;padding:6px 0">Cantidad</th></tr>${items.map(i=>`<tr style="border-bottom:1px solid #f5f5f5"><td style="padding:8px 0">${esc(i.nombre)}</td><td style="text-align:right;padding:8px 0"><strong>${i.q%1===0?i.q:i.q.toFixed(3)} ${i.unit}</strong></td></tr>`).join('')}</table><p style="margin-top:16px;font-weight:bold;color:#34522A">Costo estimado: ${fmt(total,sym)}</p></div>`;
    document.getElementById('pa').innerHTML=html;window.print();
  }
  return(
    <Modal title={`Báscula — ${rec.nombre}`} onClose={onClose}>
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        {['tandas','unidades'].map(m=>(
          <button key={m} onClick={()=>setModo(m)} style={{flex:1,padding:'9px 0',borderRadius:10,border:`1.5px solid ${modo===m?'var(--forest)':'#E2E8D8'}`,background:modo===m?'var(--forest)':'white',color:modo===m?'white':'var(--olive)',fontWeight:600,fontSize:13.5,cursor:'pointer',fontFamily:'Instrument Sans,sans-serif'}}>
            {m==='tandas'?'Por tandas':`Por ${rec.rend_u||'unidades'}`}
          </button>
        ))}
      </div>
      <FI label={`Cantidad de ${modo==='tandas'?'tandas':(rec.rend_u||'unidades')}`} type="number" min=".5" step=".5" value={cant} onChange={e=>setCant(+e.target.value||1)}/>
      <div style={{background:'#F0F7E8',borderRadius:12,overflow:'hidden',marginBottom:16}}>
        <table>
          <thead style={{background:'rgba(0,0,0,.04)'}}><tr><th>Ingrediente</th><th style={{textAlign:'right'}}>Necesitás</th><th style={{textAlign:'right'}}>Costo</th></tr></thead>
          <tbody>{items.map((i,idx)=>(
            <tr key={idx}><td>{i.nombre}</td><td style={{textAlign:'right',fontFamily:'monospace',fontSize:13}}>{i.q%1===0?i.q:i.q.toFixed(3)} {i.unit}</td><td style={{textAlign:'right',fontWeight:600,color:'var(--forest)'}}>{fmt(i.costo,sym)}</td></tr>
          ))}</tbody>
        </table>
        <div style={{padding:'10px 16px',borderTop:'1px solid rgba(0,0,0,.06)',display:'flex',justifyContent:'space-between',fontWeight:700,color:'var(--forest)'}}>
          <span>Total</span><span>{fmt(total,sym)}</span>
        </div>
      </div>
      <div style={{display:'flex',gap:12,justifyContent:'flex-end'}}>
        <Btn v='s' onClick={print}><Icon n='print' s={14}/> Imprimir</Btn>
        <Btn onClick={onClose}>Cerrar</Btn>
      </div>
    </Modal>
  );
}

// ── CALCULADORA ───────────────────────────────────────────────────────────
function Calc({D,ops}){
  const [q,setQ]=useState('');
  const [modal,setModal]=useState(null);
  const [del,setDel]=useState(null);
  const {sym}=D.cfg;
  const list=useMemo(()=>D.prod.filter(p=>p.nombre.toLowerCase().includes(q.toLowerCase())),[D.prod,q]);
  const save=d=>{ops.ups('prod',d,modal?.id);setModal(null);toast(modal?.id?'Producto actualizado':'Producto creado');};
  return(
    <div className="pp" style={{maxWidth:960,margin:'0 auto'}}>
      <PH title="Calculadora de Precios" sub={`${D.prod.length} productos`} action={<Btn onClick={()=>setModal({})}>+ Nuevo producto</Btn>}/>
      <SB val={q} set={setQ} ph="Buscar producto..."/>
      {list.length===0?<Empty icon={<Icon n="calc" s={26} c="var(--forest)"/>} title="Sin productos" sub="Calculá el precio de venta de tus panes." action={<Btn onClick={()=>setModal({})}>+ Crear producto</Btn>}/>:
        <div className="card tbl" style={{overflow:'hidden'}}>
          <table>
            <thead><tr><th>Producto</th><th>SKU</th><th>Costo real</th><th>Precio venta</th><th>Ganancia</th><th>₡/hora</th><th></th></tr></thead>
            <tbody>{list.map(p=>{
              const gan=p.price-(p.cost||0);
              const pct=p.cost>0?Math.round(gan/p.price*100):null;
              const xhora=(p.tiempo&&p.tiempo>0)?Math.round(gan/(p.tiempo/60)):null;
              return <tr key={p.id}>
                <td style={{fontWeight:600}}>{p.nombre}</td>
                <td style={{fontSize:12,fontFamily:'monospace',color:'var(--olive)'}}>{p.sku||'—'}</td>
                <td>{fmt(p.cost||0,sym)}</td>
                <td style={{fontWeight:700,color:'var(--forest)'}}>{fmt(p.price||0,sym)}</td>
                <td>{pct!=null?<span className={`badge ${pct>20?'bg':pct>0?'by':'brd'}`}>{pct}%</span>:'—'}</td>
                <td style={{fontWeight:600,color:'var(--forest)'}}>{xhora!=null?fmt(xhora,sym):'—'}</td>
                <td><div style={{display:'flex',gap:4}}><Btn v='g' sm onClick={()=>setModal(p)}><Icon n='edit' s={14}/></Btn><Btn v='g' sm onClick={()=>setDel(p)}><Icon n='trash' s={14}/></Btn></div></td>
              </tr>;
            })}</tbody>
          </table>
        </div>
      }
      {modal!==null&&<ProdModal prod={modal} D={D} onSave={save} onClose={()=>setModal(null)}/>}
      {del&&<CDel what={del.nombre} onOk={()=>{ops.del('prod',del.id);setDel(null);toast('Producto eliminado','err');}} onNo={()=>setDel(null)}/>}
    </div>
  );
}
function ProdModal({prod,D,onSave,onClose}){
  const {sym}=D.cfg;
  const[f,sf]=useState({nombre:'',sku:'',recs:[],extras:0,tiempo:0,waste:5,ut_type:'fixed',ut:0,ship:0,comm:0,notes:'',...prod});
  const s=k=>e=>sf(p=>({...p,[k]:e.target.value}));
  const n=k=>e=>sf(p=>({...p,[k]:parseFloat(e.target.value)||0}));
  const[nr,snr]=useState({rid:'',t:1});
  const addR=()=>{if(!nr.rid)return;sf(p=>({...p,recs:[...p.recs,{...nr,key:uid()}]}));snr({rid:'',t:1});};
  const rcost=f.recs.reduce((t,rc)=>{const r=D.rec.find(x=>x.id===rc.rid);return r?t+recipeCost(r,D.ing)*(rc.t||1):t;},0);
  const gi_hora=(D.cfg.gastos_fijos||0)/(D.cfg.horas_mes||60);
  const gi_prod=gi_hora*((+f.tiempo||0)/60);
  const base=rcost+(+f.extras)+gi_prod;
  const withWaste=base*(1+(+f.waste||0)/100);
  const utAmt=f.ut_type==='pct'?withWaste*(+f.ut/100):(+f.ut);
  const final=withWaste+utAmt+(+f.ship)+withWaste*((+f.comm)/100);
  const ganancia=final-withWaste;
  const ingreso_hora=(+f.tiempo)>0?ganancia/((+f.tiempo)/60):null;
  return(
    <Modal title={prod.id?'Editar producto':'Nuevo producto'} onClose={onClose} wide>

          const r=D.rec.find(x=>x.id===rc.rid);
          const c=r?recipeCost(r,D.ing)*(rc.t||1):0;
          return <tr key={rc.key||rc.rid}><td>{r?.nombre||'—'}</td><td style={{textAlign:'center'}}>{rc.t}</td><td style={{color:'var(--forest)'}}>{fmt(c,sym)}</td><td><button onClick={()=>sf(p=>({...p,recs:p.recs.filter(x=>x.key!==rc.key)}))} style={{border:'none',background:'none',cursor:'pointer',color:'#ccc'}} onMouseEnter={e=>e.target.style.color='#e00'} onMouseLeave={e=>e.target.style.color='#ccc'}>✕</button></td></tr>;
        })}</tbody></table>
      </div>}
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        <select value={nr.rid} onChange={e=>snr(p=>({...p,rid:e.target.value}))} style={{flex:1}}>
          <option value="">Agregar receta...</option>
          {D.rec.map(r=><option key={r.id} value={r.id}>{r.nombre}</option>)}
        </select>
        <input type="number" min=".5" step=".5" placeholder="Tandas" value={nr.t} onChange={e=>snr(p=>({...p,t:+e.target.value||1}))} style={{width:80}}/>
        <Btn onClick={addR} disabled={!nr.rid}>+</Btn>
      </div>
      <div className="g3" style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        <FI label="Empaque (₡)" type="number" value={f.extras} onChange={n('extras')} placeholder="Bolsa + sticker"/>
        <FI label="Tiempo activo (min)" type="number" value={f.tiempo||0} onChange={n('tiempo')} placeholder="Minutos de trabajo activo"/>
        <FI label="Merma (%)" type="number" step=".5" value={f.waste} onChange={n('waste')}/>
      </div>
      <div className="g3" style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        <F label="Precio de venta">
          <div style={{display:'flex',gap:8}}>
            {['fixed','pct'].map(m=><button key={m} onClick={()=>sf(p=>({...p,ut_type:m}))} style={{flex:1,padding:'9px 0',borderRadius:9,border:`1.5px solid ${f.ut_type===m?'var(--forest)':'#E2E8D8'}`,background:f.ut_type===m?'var(--forest)':'white',color:f.ut_type===m?'white':'var(--olive)',fontWeight:600,fontSize:13,cursor:'pointer',fontFamily:'Instrument Sans,sans-serif'}}>{m==='fixed'?'Monto fijo':'% margen'}</button>)}
          </div>
        </F>
        <FI label={f.ut_type==='pct'?'Margen objetivo (%)':'Ganancia neta (₡)'} type="number" value={f.ut} onChange={n('ut')}/>
        <FI label="Envío / comisión" type="number" value={f.ship} onChange={n('ship')}/>
      </div>
      <div style={{background:'#F0F7E8',borderRadius:12,padding:16,marginBottom:16}}>
        <h3 className="serif" style={{fontSize:16,color:'var(--forest)',marginBottom:12}}>Resumen</h3>
        <div style={{display:'flex',flexDirection:'column',gap:6,fontSize:13.5}}>
          {[['Ingredientes',rcost],[`Empaque`,+f.extras],['Gastos fijos dist.',gi_prod]].map(([l,v])=>v>0&&<div key={l} style={{display:'flex',justifyContent:'space-between',color:'var(--forest)'}}><span>{l}</span><span>{fmt(v,sym)}</span></div>)}
          <div style={{display:'flex',justifyContent:'space-between',fontWeight:600,paddingTop:6,borderTop:'1px solid rgba(52,82,42,.2)',color:'var(--forest)'}}><span>Subtotal</span><span>{fmt(base,sym)}</span></div>
          {f.waste>0&&<div style={{display:'flex',justifyContent:'space-between',color:'var(--olive)'}}><span>+ Merma ({f.waste}%)</span><span>{fmt(withWaste-base,sym)}</span></div>}

          <div style={{display:'flex',justifyContent:'space-between',color:'#2D6A4F',fontWeight:600}}><span>Ganancia neta</span><span>{fmt(ganancia,sym)}</span></div>
          {ingreso_hora!=null&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:8,borderTop:'2px solid var(--forest)',marginTop:4}}>
            <span style={{fontWeight:700,fontSize:15,color:'var(--forest)'}}>₡ por hora activa</span>
            <span className="serif" style={{fontSize:26,fontWeight:700,color:'var(--forest)'}}>{fmt(ingreso_hora,sym)}</span>
          </div>}
          {ingreso_hora==null&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:8,borderTop:'2px solid var(--forest)',marginTop:4}}>
            <span style={{fontWeight:700,fontSize:15,color:'var(--forest)'}}>Precio de venta</span>
            <span className="serif" style={{fontSize:26,fontWeight:700,color:'var(--forest)'}}>{fmt(final,sym)}</span>
          </div>}
        </div>
      </div>
      <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:8}}>
        <Btn v='s' onClick={onClose}>Cancelar</Btn>
        <Btn onClick={()=>f.nombre.trim()&&onSave({...f,cost:withWaste,price:final})} disabled={!f.nombre.trim()}>Guardar</Btn>
      </div>
    </Modal>
  );
}

// ── CLIENTES ──────────────────────────────────────────────────────────────
function Cli({D,ops}){
  const [q,setQ]=useState('');
  const [modal,setModal]=useState(null);
  const [del,setDel]=useState(null);
  const [sel,setSel]=useState(null);
  const {sym}=D.cfg;
  const list=useMemo(()=>D.cli.filter(c=>`${c.nombre} ${c.tel||''}`.toLowerCase().includes(q.toLowerCase())),[D.cli,q]);
  const save=d=>{ops.ups('cli',d,modal?.id);setModal(null);toast(modal?.id?'Cliente actualizado':'Cliente agregado');};
  if(sel){
    const c=D.cli.find(x=>x.id===sel);
    if(!c){setSel(null);return null;}
    const peds=D.ped.filter(p=>p.cli_id===c.id).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
    const tot=peds.filter(p=>p.estado==='Entregado').reduce((s,p)=>s+(p.total||0),0);
    return(
      <div className="pp" style={{maxWidth:800,margin:'0 auto'}}>
        <button className="back-btn" onClick={()=>setSel(null)}><Icon n="left" s={15}/> Volver</button>
        <div className="card" style={{padding:24,margin:'16px 0 24px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div>
              <h1 className="serif" style={{fontSize:24,color:'var(--forest)'}}>{c.nombre}</h1>
              {c.tel&&<p style={{fontSize:13,color:'var(--olive)',marginTop:6,display:'flex',alignItems:'center',gap:6}}><Icon n='users' s={13}/>{c.tel}</p>}
              {c.email&&<p style={{fontSize:13,color:'var(--olive)'}}>✉️ {c.email}</p>}
              {c.notes&&<p style={{fontSize:13,color:'var(--olive)',fontStyle:'italic',marginTop:8}}>{c.notes}</p>}
            </div>
            <div style={{textAlign:'right'}}>
              <div className="serif" style={{fontSize:24,fontWeight:700,color:'var(--forest)'}}>{fmt(tot,sym)}</div>
              <div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',color:'var(--olive)'}}>Total gastado</div>
              <div className="serif" style={{fontSize:20,fontWeight:700,color:'var(--forest)',marginTop:8}}>{peds.length}</div>
              <div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',color:'var(--olive)'}}>Pedidos</div>
            </div>
          </div>
        </div>
        <h2 className="serif" style={{fontSize:18,color:'var(--forest)',marginBottom:12}}>Historial de pedidos</h2>

      {list.length===0?<Empty icon={<Icon n="users" s={26} c="var(--forest)"/>} title="Sin clientes" sub="Agregá tus clientes para llevar su historial." action={<Btn onClick={()=>setModal({})}>+ Agregar</Btn>}/>:
        <div className="card tbl" style={{overflow:'hidden'}}>
          <table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Pedidos</th><th>Total gastado</th><th></th></tr></thead>
          <tbody>{list.map(c=>{
            const peds=D.ped.filter(p=>p.cli_id===c.id);
            const tot=peds.filter(p=>p.estado==='Entregado').reduce((s,p)=>s+(p.total||0),0);

}

// ── PEDIDOS ───────────────────────────────────────────────────────────────
function Ped({D,ops}){
  const [q,setQ]=useState('');
  const [est,setEst]=useState('Todos');
  const [modal,setModal]=useState(null);
  const [del,setDel]=useState(null);
  const {sym}=D.cfg;
  const list=useMemo(()=>{
    let r=D.ped;
    if(est!=='Todos')r=r.filter(p=>p.estado===est);
    if(q){const ql=q.toLowerCase();r=r.filter(p=>{const c=D.cli.find(x=>x.id===p.cli_id);return(c?.nombre||'').toLowerCase().includes(ql)||(p.desc||'').toLowerCase().includes(ql);});}
    return r.sort((a,b)=>(b.fecha_e||b.fecha||'').localeCompare(a.fecha_e||a.fecha||''));
  },[D.ped,est,q,D.cli]);
  const save=d=>{ops.ups('ped',d,modal?.id);setModal(null);toast(modal?.id?'Pedido actualizado':'Pedido creado');};
  const cl=id=>D.cli.find(c=>c.id===id);
  function nota(p){
    const c=cl(p.cli_id);const saldo=(p.total||0)-(p.adelanto||0);
    const html=`<div style="font-family:sans-serif;max-width:480px;margin:0 auto;padding:32px"><div style="text-align:center;border-bottom:2px solid #34522A;padding-bottom:20px;margin-bottom:20px"><div style="font-family:serif;font-size:34px;font-style:italic;color:#34522A">sensa</div><div style="font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#818A6D">Panetteria</div>${D.cfg.dir?`<div style="font-size:12px;color:#818A6D;margin-top:4px">${esc(D.cfg.dir)}</div>`:''}</div><h2 style="color:#34522A;margin:0 0 16px">Nota de Venta #${p.id.slice(-6).toUpperCase()}</h2><p><strong>Cliente:</strong> ${c?.nombre||'—'}</p>${c?.tel?`<p><strong>Tel:</strong> ${c.tel}</p>`:''}<p><strong>Entrega:</strong> ${fdate(p.fecha_e)}</p><div style="background:#F5F6EF;padding:12px;border-radius:8px;margin:16px 0">${esc(p.desc||'Sin descripción')}</div><table style="width:100%;border-collapse:collapse"><tr style="border-top:2px solid #34522A;border-bottom:1px solid #eee"><td style="padding:10px 0;font-weight:bold">Total</td><td style="text-align:right;font-size:24px;font-weight:bold;color:#34522A;font-family:serif">${fmt(p.total||0,sym)}</td></tr>${(p.adelanto||0)>0?`<tr style="border-bottom:1px solid #eee"><td style="padding:8px 0">Adelanto</td><td style="text-align:right;color:#2D6A4F">-${fmt(p.adelanto,sym)}</td></tr>`:''}${saldo>0.01?`<tr><td style="padding:8px 0;font-weight:bold">Saldo pendiente</td><td style="text-align:right;color:#BE123C;font-weight:bold">${fmt(saldo,sym)}</td></tr>`:'<tr><td style="padding:8px 0;color:#2D6A4F" colspan="2">✓ Pagado completamente</td></tr>'}</table>${p.notes?`<p style="color:#818A6D;font-size:13px;font-style:italic;margin-top:16px">${esc(p.notes)}</p>`:''}<p style="text-align:center;color:#DAE38E;margin-top:32px;font-weight:700">¡Gracias por su preferencia!</p></div>`;
    document.getElementById('pa').innerHTML=html;window.print();
  }
  return(
    <div className="pp" style={{maxWidth:1100,margin:'0 auto'}}>
      <PH title="Pedidos" sub={`${D.ped.length} totales`} action={<Btn onClick={()=>setModal({})}>+ Nuevo pedido</Btn>}/>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
        {['Todos',...ESTADOS].map(e=><button key={e} onClick={()=>setEst(e)} style={{padding:'5px 14px',borderRadius:20,border:`1.5px solid ${est===e?'var(--forest)':'#E2E8D8'}`,background:est===e?'var(--forest)':'white',color:est===e?'white':'var(--olive)',fontWeight:600,fontSize:12.5,cursor:'pointer',fontFamily:'Instrument Sans,sans-serif'}}>{e}</button>)}
      </div>
      <SB val={q} set={setQ} ph="Buscar por cliente o descripción..."/>
      {list.length===0?<Empty icon={<Icon n="package" s={26} c="var(--forest)"/>} title="Sin pedidos" sub="Registrá tus pedidos para controlar entregas y cobros." action={<Btn onClick={()=>setModal({})}>+ Registrar</Btn>}/>:
        <div className="card tbl" style={{overflow:'hidden'}}>
          <table><thead><tr><th>Cliente</th><th>Descripción</th><th>Entrega</th><th>Total</th><th>Saldo</th><th>Estado</th><th></th></tr></thead>
          <tbody>{list.map(p=>{
            const saldo=(p.total||0)-(p.adelanto||0);
            return <tr key={p.id}>
              <td style={{fontWeight:600}}>{cl(p.cli_id)?.nombre||'Sin cliente'}</td>
              <td style={{fontSize:13,color:'var(--olive)',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.desc||'—'}</td>
              <td>{fdate(p.fecha_e)}</td>
              <td style={{fontWeight:700}}>{fmt(p.total||0,sym)}</td>
              <td style={{fontWeight:saldo>0.01?700:400,color:saldo>0.01?'#BE123C':'#ccc'}}>{saldo>0.01?fmt(saldo,sym):'✓'}</td>
              <td><span className={`badge ${BADGE_E[p.estado]||'bc'}`}>{p.estado}</span></td>
              <td><div style={{display:'flex',gap:4}}><Btn v='g' sm onClick={()=>nota(p)} title='Nota'><Icon n='print' s={14}/></Btn><Btn v='g' sm onClick={()=>setModal(p)}><Icon n='edit' s={14}/></Btn><Btn v='g' sm onClick={()=>setDel(p)}><Icon n='trash' s={14}/></Btn></div></td>
            </tr>;
          })}</tbody></table>
        </div>
      }
      {modal!==null&&<PedModal ped={modal} D={D} ops={ops} onSave={save} onClose={()=>setModal(null)}/>}
      {del&&<CDel what={`pedido de ${cl(del.cli_id)?.nombre||'cliente'}`} onOk={()=>{ops.del('ped',del.id);setDel(null);toast('Pedido eliminado','err');}} onNo={()=>setDel(null)}/>}
    </div>
  );
}
function PedModal({ped,D,ops,onSave,onClose}){

          </div>

            <div style={{fontSize:11,fontWeight:700,color:'var(--olive)',textTransform:'uppercase',letterSpacing:'.05em'}}>Nuevo cliente</div>
            <input placeholder="Nombre *" value={nc.nombre} onChange={e=>setNc(p=>({...p,nombre:e.target.value}))}/>
            <input placeholder="Teléfono / WhatsApp" value={nc.tel} onChange={e=>setNc(p=>({...p,tel:e.target.value}))}/>

          </div>}
        </F>
        <FS label="Estado" value={f.estado} onChange={s('estado')} opts={ESTADOS}/>

        <FI label="Fecha de pedido" type="date" value={f.fecha} onChange={s('fecha')}/>
        <FI label="Fecha de entrega" type="date" value={f.fecha_e||''} onChange={s('fecha_e')}/>
      </div>
      <FT label="Descripción *" value={f.desc||''} onChange={s('desc')} placeholder="Ej: 2 hogazas masa madre 700g + 1 baguette"/>
      <div className="g3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
        <FI label={`Total (${sym})`} type="number" step="50" value={f.total||''} onChange={s('total')}/>
        <FI label={`Adelanto (${sym})`} type="number" step="50" value={f.adelanto||''} onChange={s('adelanto')}/>
        <F label="Saldo pendiente"><div style={{padding:'9px 12px',borderRadius:9,fontWeight:700,fontSize:15,background:saldo>0.01?'#FFF1F2':'#F0FDF4',color:saldo>0.01?'#BE123C':'#2D6A4F'}}>{saldo>0.01?fmt(saldo,sym):'✓ Pagado'}</div></F>
      </div>

      <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:8}}>
        <Btn v='s' onClick={onClose}>Cancelar</Btn>
        <Btn onClick={()=>f.cli_id&&onSave(f)} disabled={!f.cli_id}>Guardar</Btn>
      </div>
    </Modal>
  );
}

function CalDayModal({day,peds,cli,sym,onClose}){

  return(
    <Modal title={`Pedidos — ${fdate(day)}`} onClose={onClose}>
      {peds.map(p=>(
        <div key={p.id} style={{border:'1px solid #EEF0E8',borderRadius:10,padding:16,marginBottom:12}}>

            <span style={{fontWeight:600}}>{cl(p.cli_id)?.nombre||'Sin cliente'}</span>
            <span className={`badge ${BADGE_E[p.estado]||'bc'}`}>{p.estado}</span>
          </div>
          <p style={{fontSize:13,color:'var(--olive)'}}>{p.desc||'—'}</p>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:8,fontSize:13}}>
