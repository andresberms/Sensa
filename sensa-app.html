function Cal({D}){
  const [m,setM]=useState(()=>{const d=new Date();return{y:d.getFullYear(),mo:d.getMonth()};});
  const [day,setDay]=useState(null);
  const {sym}=D.cfg;
  const first=new Date(m.y,m.mo,1),off=(first.getDay()+6)%7,last=new Date(m.y,m.mo+1,0).getDate();
  const dias=[];
  for(let i=0;i<off;i++){const d=new Date(m.y,m.mo,-off+i+1);dias.push({d:d.toISOString().split('T')[0],curr:false});}
  for(let i=1;i<=last;i++)dias.push({d:new Date(m.y,m.mo,i).toISOString().split('T')[0],curr:true});
  const gd=date=>D.ped.filter(p=>p.fecha_e===date&&p.estado!=='Cancelado');
  const cl=id=>D.cli.find(c=>c.id===id);
  const hoy=today();
  const nav=v=>{const nd=new Date(m.y,m.mo+v);setM({y:nd.getFullYear(),mo:nd.getMonth()});};
  return(
    <div className="pp" style={{maxWidth:900,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
        <h1 style={{fontFamily:'Instrument Serif,serif',fontSize:30,fontStyle:'italic',color:'var(--forest)',fontWeight:400}}>Calendario</h1>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <Btn v='s' sm onClick={()=>nav(-1)}>‹</Btn>
          <span style={{fontWeight:600,color:'var(--forest)',minWidth:140,textAlign:'center'}}>{MESES[m.mo]} {m.y}</span>
          <Btn v='s' sm onClick={()=>nav(1)}>›</Btn>
          {(m.y!==new Date().getFullYear()||m.mo!==new Date().getMonth())&&<Btn v='s' sm onClick={()=>{const d=new Date();setM({y:d.getFullYear(),mo:d.getMonth()});}}>Hoy</Btn>}
        </div>
      </div>
      <div className="card tbl" style={{overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'var(--forest)'}}>
          {['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=><div key={d} style={{textAlign:'center',padding:'10px 0',fontSize:11,fontWeight:700,color:'var(--pistachio)',letterSpacing:'.05em'}}>{d}</div>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:1,background:'#E8EDE0'}}>
          {dias.map(({d,curr})=>{
            const peds=gd(d),isT=d===hoy;
            return(
              <div key={d} onClick={()=>peds.length&&setDay(d)} className="cal-cell" style={{background:'white',padding:8,minHeight:72,opacity:curr?1:.4,cursor:peds.length?'pointer':'default'}}>
                <div style={{fontSize:13.5,fontWeight:600,width:26,height:26,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:isT?'var(--forest)':'transparent',color:isT?'white':'#555',marginBottom:4}}>{new Date(d+'T12:00').getDate()}</div>
                {peds.slice(0,2).map(p=><div key={p.id} style={{fontSize:11,background:'var(--pistachio)',color:'var(--forest)',borderRadius:4,padding:'1px 6px',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:600}}>{cl(p.cli_id)?.nombre?.split(' ')[0]||'?'}</div>)}
                {peds.length>2&&<div style={{fontSize:11,color:'var(--olive)'}}>+{peds.length-2}</div>}
              </div>
            );
          })}
        </div>
      </div>
      {day&&<CalDayModal day={day} peds={gd(day)} cli={D.cli} sym={sym} onClose={()=>setDay(null)}/>}
    </div>
  );
}

// ── REPORTES ──────────────────────────────────────────────────────────────
function Rep({D}){
  const {sym}=D.cfg;
  const [desde,setDesde]=useState(()=>{const d=new Date();d.setDate(1);return d.toISOString().split('T')[0];});
  const [hasta,setHasta]=useState(today);
  const peds=useMemo(()=>D.ped.filter(p=>p.estado==='Entregado'&&(p.fecha||'')>=desde&&(p.fecha||'')<=hasta),[D.ped,desde,hasta]);
  const total=peds.reduce((s,p)=>s+(p.total||0),0);
  const ticket=peds.length?total/peds.length:0;
  const nclients=new Set(peds.map(p=>p.cli_id)).size;
  const byDay=useMemo(()=>{const m={};peds.forEach(p=>{m[p.fecha]=(m[p.fecha]||0)+(p.total||0);});return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));},[ peds]);
  const topCli=useMemo(()=>{const m={};peds.forEach(p=>{if(!m[p.cli_id])m[p.cli_id]={n:0,t:0};m[p.cli_id].n++;m[p.cli_id].t+=p.total||0;});return Object.entries(m).map(([id,v])=>({c:D.cli.find(x=>x.id===id),...v})).filter(x=>x.c).sort((a,b)=>b.t-a.t).slice(0,5);},[peds,D.cli]);
  const mx=Math.max(...byDay.map(v=>v[1]),1);
  return(
    <div className="pp" style={{maxWidth:900,margin:'0 auto'}}>
      <h1 style={{fontFamily:'Instrument Serif,serif',fontSize:30,fontStyle:'italic',color:'var(--forest)',fontWeight:400,marginBottom:28}}>Reportes de Venta</h1>
      <div className="card rep-dates" style={{padding:16,marginBottom:24,display:'flex',flexWrap:'wrap',gap:12,alignItems:'flex-end'}}>
        <div style={{flex:1,minWidth:140}}><label>Desde</label><input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{width:'100%'}}/></div>
        <div style={{flex:1,minWidth:140}}><label>Hasta</label><input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{width:'100%'}}/></div>
      </div>
      <div className="g2" style={{gap:12,marginBottom:28}}>
        {[{l:'Ventas totales',v:fmt(total,sym),i:'chart',bg:'#F0F7E8',c:'var(--forest)'},{l:'Pedidos entregados',v:peds.length,i:'package',bg:'#EEF6FF',c:'#1E3A5F'},{l:'Ticket promedio',v:fmt(ticket,sym),i:'calc',bg:'var(--cotton)',c:'#9D174D'},{l:'Clientes atendidos',v:nclients,i:'users',bg:'#F5F3FF',c:'#4C1D95'}].map(s=>(
          <div key={s.l} className="card" style={{padding:18,background:s.bg}}>
            <div style={{marginBottom:8}}><Icon n={s.i} s={20} c={s.c} sw={1.5}/></div>
            <div className="serif" style={{fontSize:24,fontWeight:700,color:s.c}}>{s.v}</div>
            <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em',color:s.c,opacity:.7,marginTop:4}}>{s.l}</div>
          </div>
        ))}
      </div>
      {byDay.length>0&&<div className="card" style={{padding:20,marginBottom:20}}>
        <h2 className="serif" style={{fontSize:17,color:'var(--forest)',marginBottom:16}}>Ventas diarias</h2>
        <div style={{display:'flex',alignItems:'flex-end',gap:6,overflowX:'auto',paddingBottom:28,height:140,paddingTop:4}}>
          {byDay.map(([f,v])=>(
            <div key={f} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,flexShrink:0,minWidth:40}}>
              <div style={{fontSize:9.5,fontWeight:700,color:'var(--forest)',whiteSpace:'nowrap'}}>{sym==='₡'?Math.round(v/1000)+'K':'$'+Math.round(v)}</div>
              <div style={{width:24,height:`${Math.max((v/mx)*80,4)}px`,borderRadius:'4px 4px 0 0',background:'var(--forest)',opacity:.75+.25*(v/mx)}} title={`${f}: ${fmt(v,sym)}`}/>
              <div style={{fontSize:9,color:'var(--olive)',transform:'rotate(-40deg)',transformOrigin:'top left',whiteSpace:'nowrap',marginTop:2,marginLeft:6}}>{f.slice(5)}</div>
            </div>
          ))}
        </div>
      </div>}
      {topCli.length>0&&<div className="card" style={{padding:20,overflow:'hidden'}}>
        <h2 className="serif" style={{fontSize:17,color:'var(--forest)',marginBottom:12}}>Top clientes</h2>
        <table><thead><tr><th>Cliente</th><th>Pedidos</th><th>Total</th></tr></thead>
        <tbody>{topCli.map(({c,n,t})=><tr key={c.id}><td style={{fontWeight:600}}>{c.nombre}</td><td>{n}</td><td style={{fontWeight:700,color:'var(--forest)'}}>{fmt(t,sym)}</td></tr>)}</tbody></table>
      </div>}
      {peds.length===0&&<Empty icon={<Icon n="chart" s={26} c="var(--forest)"/>} title="Sin datos en este período" sub="Ajustá el rango o registrá pedidos como 'Entregado'."/>}
    </div>
  );
}

// ── CONFIGURACIÓN ─────────────────────────────────────────────────────────
function Cfg({D,ops,synced}){
  const [f,sf]=useState({...D.cfg});
  const [showSetup,setShowSetup]=useState(false);
  const [confirm,setConfirm]=useState(null);
  function save(){ops.saveCfg(f);toast('Configuración guardada');}
  function exportD(){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));
    a.download=`sensa-backup-${today()}.json`;a.click();
  }
  function importD(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d||typeof d!=='object')throw new Error();
        setConfirm({title:'Importar datos',body:'Esto reemplaza todo lo actual. ¿Continuás?',okLabel:'Importar',danger:true,onOk:()=>{
          ['ing','rec','prod','cli','ped'].forEach(k=>{
            if(Array.isArray(d[k]))d[k].forEach(item=>{if(item?.id)ops.ups(k,item,item.id);});
          });
          if(d.cfg)ops.saveCfg({...DEF.cfg,...d.cfg});
          toast('Datos importados correctamente');setConfirm(null);
        }});
      }catch{toast('Archivo inválido — usá un backup de Sensa','err');}
    };
    r.readAsText(file);e.target.value='';
  }
  function discFB(){setConfirm({title:'Desconectar Firebase',body:'Los datos dejarán de sincronizarse. Podés reconectar cuando quieras.',okLabel:'Desconectar',danger:true,onOk:()=>{localStorage.removeItem(LSF);window.location.reload();}});}
  if(showSetup)return <Setup onDone={()=>window.location.reload()} onSkip={()=>setShowSetup(false)}/>;
  return(<>
    <div className="pp" style={{maxWidth:600,margin:'0 auto'}}>
      <h1 style={{fontFamily:'Instrument Serif,serif',fontSize:30,fontStyle:'italic',color:'var(--forest)',fontWeight:400,marginBottom:28}}>Configuración</h1>
      <div className="card" style={{padding:24,marginBottom:16}}>
        <h2 className="serif" style={{fontSize:18,color:'var(--forest)',marginBottom:16}}>Datos del negocio</h2>
        <FI label="Nombre del negocio" value={f.nombre||''} onChange={e=>sf(p=>({...p,nombre:e.target.value}))}/>
        <FI label="Dirección" value={f.dir||''} onChange={e=>sf(p=>({...p,dir:e.target.value}))} placeholder="San José, Costa Rica"/>
        <FI label="Teléfono / WhatsApp" value={f.tel||''} onChange={e=>sf(p=>({...p,tel:e.target.value}))} placeholder="+506 8888-8888"/>
        <F label="Moneda">
          <select value={f.moneda||'CRC'} onChange={e=>{const mo=MONEDAS.find(x=>x.value===e.target.value);sf(p=>({...p,moneda:mo.value,sym:mo.sym}));}}>
            {MONEDAS.map(m=><option key={m.value} value={m.value}>{m.label}</option>)}
          </select>
        </F>
        <Btn onClick={save}>Guardar cambios</Btn>
      </div>
      <div className="card" style={{padding:24,marginBottom:16}}>
        <h2 className="serif" style={{fontSize:18,color:'var(--forest)',marginBottom:6}}>Costos operativos</h2>
        <p style={{fontSize:13,color:'var(--olive)',marginBottom:16}}>Usados para calcular el costo de gastos fijos por producto según tiempo de trabajo activo.</p>
        <FI label="Gastos fijos mensuales (₡)" type="number" value={f.gastos_fijos||0} onChange={e=>sf(p=>({...p,gastos_fijos:parseFloat(e.target.value)||0}))} placeholder="Luz, agua, gas, suscripciones…"/>
        <FI label="Horas de producción al mes" type="number" value={f.horas_mes||60} onChange={e=>sf(p=>({...p,horas_mes:parseFloat(e.target.value)||60}))} placeholder="60"/>
        {(f.gastos_fijos||0)>0&&(f.horas_mes||0)>0&&<p style={{fontSize:12,color:'var(--olive)',marginTop:-8,marginBottom:16}}>₡{Math.round((f.gastos_fijos||0)/(f.horas_mes||60)).toLocaleString('es-CR')} por hora de producción</p>}
        <Btn onClick={save}>Guardar cambios</Btn>
      </div>
      <div className="card" style={{padding:24,marginBottom:16}}>
        <h2 className="serif" style={{fontSize:18,color:'var(--forest)',marginBottom:6}}>Sincronización en la nube</h2>
        <p style={{fontSize:13,color:'var(--olive)',marginBottom:16}}>Accedé desde cualquier dispositivo en tiempo real.</p>
        {synced?(
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',borderRadius:10,background:'#F0F7E8',marginBottom:12}}>
              <div style={{width:8,height:8,borderRadius:'50%',background:'#2D6A4F'}}/>
              <span style={{fontSize:13.5,fontWeight:600,color:'var(--forest)'}}>Firebase activo — sincronización en tiempo real</span>
            </div>
            <Btn v='d' onClick={discFB}>Desconectar Firebase</Btn>
          </div>
        ):(
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',borderRadius:10,background:'var(--cream)',marginBottom:12}}>
              <div style={{width:8,height:8,borderRadius:'50%',background:'#ccc'}}/>
              <span style={{fontSize:13.5,color:'var(--olive)'}}>Solo este dispositivo</span>
            </div>
            <Btn onClick={()=>setShowSetup(true)}><Icon n='cloud' s={14}/> Activar sincronización gratuita</Btn>
          </div>
        )}
      </div>
      <div className="card" style={{padding:24}}>
        <h2 className="serif" style={{fontSize:18,color:'var(--forest)',marginBottom:6}}>Respaldo de datos</h2>
        <p style={{fontSize:13,color:'var(--olive)',marginBottom:16}}>Exportá o importá todos tus datos.</p>
        <div style={{display:'flex',gap:12}}>
          <Btn v='s' onClick={exportD}>Exportar datos</Btn>
          <label style={{display:'inline-flex',alignItems:'center',gap:6,borderRadius:9,fontWeight:600,fontSize:13.5,cursor:'pointer',padding:'8px 16px',background:'white',color:'var(--forest)',border:'1.5px solid #C8D8B8',fontFamily:'Instrument Sans,sans-serif'}}>
            Importar datos<input type="file" accept=".json" onChange={importD} style={{display:'none'}}/>
          </label>
        </div>
      </div>
    </div>
    {confirm&&<CConfirm {...confirm} onNo={()=>setConfirm(null)}/>}
    </>
  );
}

// ── BOTTOM NAV ────────────────────────────────────────────────────────────
const BNAV=[
  {id:'home',label:'Inicio',icon:'home'},
  {id:'ped',label:'Pedidos',icon:'package'},
  {id:'cli',label:'Clientes',icon:'users'},
  {id:'rec',label:'Recetas',icon:'book'},
];
const BNAV_MAIN=BNAV.map(n=>n.id);
function BottomNav({page,go,onMore}){
  const isMore=!BNAV_MAIN.includes(page);
  return(
    <div className="bottom-nav">
      {BNAV.map(n=>(
        <button key={n.id} className={`bnav-item${page===n.id?' active':''}`} onClick={()=>go(n.id)}>
          <span className="bnav-dot"/>
          <span className="bnav-icon"><Icon n={n.icon} s={22}/></span>
          <span className="bnav-label">{n.label}</span>
        </button>
      ))}
      <button className={`bnav-item${isMore?' active':''}`} onClick={onMore}>
        <span className="bnav-dot"/>
        <span className="bnav-icon"><Icon n='menu' s={22}/></span>
        <span className="bnav-label">Más</span>
      </button>
    </div>
  );
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────
function Sidebar({page,go,neg,synced,onClose}){
  return(
    <div className="sidebar">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:28,paddingLeft:4}}>
        <div>
          <div className="sidebar-logo">sensa</div>
          <div className="sidebar-sub">Panetteria</div>
        </div>
        {onClose&&<button onClick={onClose} style={{background:'rgba(255,255,255,.1)',border:'none',cursor:'pointer',color:'rgba(245,246,239,.6)',fontSize:13,padding:'4px 7px',borderRadius:7,lineHeight:1}}>✕</button>}
      </div>
      <nav style={{flex:1}}>
        {NAV.map(n=><div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>{go(n.id);onClose&&onClose();}}>
          <span style={{width:20,display:'flex',justifyContent:'center',alignItems:'center'}}><Icon n={n.icon} s={16} c='currentColor' sw={1.75}/></span>
          <span>{n.label}</span>
        </div>)}
      </nav>
      <div style={{paddingTop:14,marginTop:8,borderTop:'1px solid rgba(255,255,255,.08)',display:'flex',alignItems:'center',gap:8}}>
        <div style={{width:8,height:8,borderRadius:'50%',background:synced?'var(--pistachio)':'rgba(255,255,255,.2)',boxShadow:synced?'0 0 6px rgba(218,227,142,.5)':'none',transition:'all .3s'}}/>
        <span style={{fontSize:11.5,color:synced?'rgba(218,227,142,.6)':'rgba(245,246,239,.3)'}}>{synced?'Sincronizado':'Solo local'}</span>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(loadLS);
  const [page,setPage]=useState('home');
  const [mob,setMob]=useState(false);
  const [synced,setSynced]=useState(false);
  const unsubs=useRef({});

  useEffect(()=>{
    const FB_CONFIG = {
      config: {
        apiKey: "AIzaSyAmWMtzUVGMdN9MQQSx8Xq7ymhvx1LZAkU",
        authDomain: "sensa-panetteria.firebaseapp.com",
        projectId: "sensa-panetteria",
        storageBucket: "sensa-panetteria.firebasestorage.app",
        messagingSenderId: "260604622284",
        appId: "1:260604622284:web:d5e307653c314b71ef5969"
      },
      workspaceId: "sensa"
    };
    const saved = loadFB() || FB_CONFIG;
    localStorage.setItem(LSF, JSON.stringify(saved));
    const ok = initFB(saved.config, saved.workspaceId);
    if(ok){ setSynced(true); subscribeAll(); }
    return()=>{Object.values(unsubs.current).forEach(u=>u&&u());};
  },[]);

  useEffect(()=>{saveLS(data);},[data]);

  function subscribeAll(){
    ['ing','rec','prod','cli','ped'].forEach(c=>{
      if(unsubs.current[c])unsubs.current[c]();
      unsubs.current[c]=col(c).onSnapshot(snap=>{
        const items=snap.docs.map(d=>({id:d.id,...d.data()}));
        setData(p=>({...p,[c]:items}));
      });
    });
    col('config').doc('main').onSnapshot(doc=>{
      if(doc.exists())setData(p=>({...p,cfg:{...p.cfg,...doc.data()}}));
    });
  }

  const ops=useMemo(()=>({
    ups(coll,item,existId){
      const final=existId?{...item,id:existId}:{...item,id:item.id||uid()};
      // Optimistic local update always (instant UI response)
      setData(p=>{const list=p[coll]||[];const ex=list.find(x=>x.id===final.id);return{...p,[coll]:ex?list.map(x=>x.id===final.id?final:x):[...list,final]};});
      // Then sync to Firebase if connected
      if(synced){fbUpsert(coll,final).catch(()=>toast('Error al guardar en la nube','err'));}
    },
    del(coll,id){
      // Optimistic local delete
      setData(p=>({...p,[coll]:(p[coll]||[]).filter(x=>x.id!==id)}));
      if(synced){fbDel(coll,id).catch(()=>toast('Error al eliminar en la nube','err'));}
    },
    saveCfg(cfg){
      setData(p=>({...p,cfg}));
      if(synced){fbCfg(cfg).catch(()=>toast('Error al guardar config','err'));}
    },
    replaceAll(k,v){setData(p=>({...p,[k]:v}));}
  }),[synced]);

  const props={D:data,ops,go:setPage};
  const views={home:<Home {...props}/>,ing:<Ing {...props}/>,rec:<Rec {...props}/>,calc:<Calc {...props}/>,cli:<Cli {...props}/>,ped:<Ped {...props}/>,cal:<Cal {...props}/>,rep:<Rep {...props}/>,cfg:<Cfg {...props} synced={synced}/>};

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      {/* Sidebar — oculto en mobile vía CSS */}
      <div className="sb-desktop">
        <Sidebar page={page} go={setPage} synced={synced}/>
      </div>

      {/* Mobile overlay */}
      {mob&&<div style={{position:'fixed',inset:0,zIndex:50,display:'flex'}}>
        <div onClick={()=>setMob(false)} style={{position:'absolute',inset:0,background:'rgba(0,0,0,.5)',backdropFilter:'blur(3px)'}}/>
        <div style={{position:'relative',zIndex:10}}>
          <Sidebar page={page} go={setPage} synced={synced} onClose={()=>setMob(false)}/>
        </div>
      </div>}

      {/* Main */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {/* Mobile header */}
        <div className="mob-bar" style={{alignItems:'center',gap:12,paddingTop:'calc(10px + env(safe-area-inset-top, 0px))',paddingBottom:'10px',paddingLeft:14,paddingRight:14,background:'var(--forest)',borderBottom:'1px solid rgba(255,255,255,.08)'}}>
          <button className="ham-btn" onClick={()=>setMob(true)} aria-label="Abrir menú">
            <span/><span/><span/>
          </button>
          <div style={{flex:1,display:'flex',alignItems:'baseline',gap:8}}>
            <span style={{fontFamily:'Instrument Serif,serif',fontStyle:'italic',fontSize:20,color:'var(--pistachio)',lineHeight:1}}>sensa</span>
            <span style={{fontSize:12,color:'rgba(218,227,142,.5)',fontWeight:500}}>·</span>
            <span style={{fontWeight:600,fontSize:13.5,color:'rgba(245,246,239,.8)'}}>{NAV.find(n=>n.id===page)?.label||'Inicio'}</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div style={{width:7,height:7,borderRadius:'50%',background:synced?'var(--pistachio)':'rgba(255,255,255,.2)',boxShadow:synced?'0 0 5px rgba(218,227,142,.5)':'none'}}/>
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto',background:'var(--cream)'}}>
          <div style={{paddingBottom:'calc(72px + env(safe-area-inset-bottom, 0px))' }}>
            {views[page]||views.home}
          </div>
        </div>
      </div>
      <BottomNav page={page} go={setPage} onMore={()=>setMob(true)}/>
      <Toaster/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
</body>
</html>
